- hosts: localhost
  connection: local
  remote_user: root
  vars:
    rabbitmq_keyring_path: /usr/share/keyrings/com.rabbitmq.team.gpg
    rabbitmq_repo_list_path: /etc/apt/sources.list.d/rabbitmq.list
    rabbitmq_version: 4.2.2-1
    rabbitmq_erlang_packages:
      - erlang-base
      - erlang-asn1
      - erlang-crypto
      - erlang-eldap
      - erlang-ftp
      - erlang-inets
      - erlang-mnesia
      - erlang-os-mon
      - erlang-parsetools
      - erlang-public-key
      - erlang-runtime-tools
      - erlang-snmp
      - erlang-ssl
      - erlang-syntax-tools
      - erlang-tftp
      - erlang-tools
      - erlang-xmerl
  tasks:
    - name: Install RabbitMQ repository prerequisites
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: true

    - name: Get Debian architecture
      command: dpkg --print-architecture
      register: rabbitmq_deb_arch
      changed_when: false

    - name: Add RabbitMQ signing key
      when: rabbitmq_deb_arch.stdout == "amd64"
      shell: |
        curl -1sLf "https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA" | gpg --dearmor -o {{ rabbitmq_keyring_path }}
      args:
        creates: "{{ rabbitmq_keyring_path }}"

    - name: Configure RabbitMQ apt repositories
      when: rabbitmq_deb_arch.stdout == "amd64"
      copy:
        dest: "{{ rabbitmq_repo_list_path }}"
        content: |
          ## Modern Erlang/OTP releases
          deb [arch={{ rabbitmq_deb_arch.stdout }} signed-by={{ rabbitmq_keyring_path }}] https://deb1.rabbitmq.com/rabbitmq-erlang/ubuntu/noble noble main
          deb [arch={{ rabbitmq_deb_arch.stdout }} signed-by={{ rabbitmq_keyring_path }}] https://deb2.rabbitmq.com/rabbitmq-erlang/ubuntu/noble noble main

          ## Latest RabbitMQ releases
          deb [arch={{ rabbitmq_deb_arch.stdout }} signed-by={{ rabbitmq_keyring_path }}] https://deb1.rabbitmq.com/rabbitmq-server/ubuntu/noble noble main
          deb [arch={{ rabbitmq_deb_arch.stdout }} signed-by={{ rabbitmq_keyring_path }}] https://deb2.rabbitmq.com/rabbitmq-server/ubuntu/noble noble main

    - name: Install Erlang packages
      apt:
        name: "{{ rabbitmq_erlang_packages }}"
        state: present
        update_cache: true

    - name: Install RabbitMQ server from Team RabbitMQ repository
      when: rabbitmq_deb_arch.stdout == "amd64"
      apt:
        name: "rabbitmq-server={{ rabbitmq_version }}"
        state: present
        update_cache: true

    - name: Install RabbitMQ server from Ubuntu repository
      when: rabbitmq_deb_arch.stdout != "amd64"
      apt:
        name: rabbitmq-server
        state: present
        update_cache: true

    - name: Enable rabbitmq management plugin
      rabbitmq_plugin:
        name: rabbitmq_management
        broker_state: offline
        state: enabled

    - name: Copy startup script for rabbitmq
      template: src=rabbitmq.sh.j2 dest=/usr/local/bin/rabbitmq.sh

    - name: Install rabbitmq users configuration script
      template: src=configure_rabbitmq_users.yml.j2 dest=/usr/local/bin/configure_rabbitmq_users.yml
    
    - name: Purge systemd and perform cleanup
      shell: apt purge -y systemd && apt-get autoremove -y && apt-get clean
