name: cvmfs-sidecar
on:
  push:
    branches: [main]
    tags:
      - '*'
    paths:
      - 'cvmfs/**'
      - 'test/cvmfs/test.sh'
      - '.github/workflows/cvmfs.yml'
  pull_request:
    paths:
      - 'cvmfs/**'
      - 'galaxy/docker-compose.yaml'
      - 'test/cvmfs/test.sh'
      - '.github/workflows/cvmfs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run CVMFS sidecar tests
        run: bash test/cvmfs/test.sh

      - name: Set image version
        id: version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            ref="${GITHUB_REF_NAME//\//-}"
            version="${ref}-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay IO
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: '$oauthtoken'
          password: ${{ secrets.QUAY_OAUTH_TOKEN }}

      - name: Build and push CVMFS image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:cvmfs"
          push: true
          tags: quay.io/bgruening/cvmfs:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
