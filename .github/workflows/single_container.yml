name: Single Container Test
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Configure Docker data-root
      run: |
        sudo mkdir -p /mnt/docker
        if [ ! -f /etc/docker/daemon.json ]; then
          echo '{}' | sudo tee /etc/docker/daemon.json
        fi
        sudo jq '."data-root"="/mnt/docker"' /etc/docker/daemon.json > /tmp/docker_daemon.json
        sudo mv /tmp/docker_daemon.json /etc/docker/daemon.json
        sudo systemctl daemon-reload
        sudo systemctl restart docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Planemo for tool and service verification
      run: python -m pip install 'planemo==0.75.47'
    - name: Test container routing
      run: python -m unittest discover -s test/cvmfs -p 'test_container_routing.py'
    - name: Build and Test
      run: bash .github/workflows/single.sh
    - name: Upload CVMFS tool test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cvmfs-tool-test-reports
        path: test-results/cvmfs-tools/
        if-no-files-found: ignore
    - name: Upload Interactive Tool test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: interactive-tool-test-reports
        path: test-results/interactive-tools/
        if-no-files-found: ignore
